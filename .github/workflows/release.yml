# Pushing a v* tag builds gh-prty for every platform gh supports and attaches
# the binaries to a GitHub release, which is where `gh extension install`
# looks for them. Teammates need neither Go nor a clone.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cli/gh-extension-precompile@v2
        with:
          go_version_file: go.mod
          generate_attestations: true
